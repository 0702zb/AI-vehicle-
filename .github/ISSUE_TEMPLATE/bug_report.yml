name: Bug report
description: Report a control-plane defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide safe steps, test names, and sanitized logs. Do not include credentials or private evidence.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Control-plane impact
      description: Which node, state field, version binding, or queue is affected?
    validations:
      required: true
