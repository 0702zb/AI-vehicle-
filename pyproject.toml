[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vw-china-concept-control-plane"
version = "0.1.0"
description = "Auditable LangGraph control plane for vehicle concept engineering workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6,<1.0",
  "langgraph-checkpoint-postgres>=2.0,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "celery[redis]>=5.4,<6.0",
  "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
observability = ["langfuse>=3.0,<4.0"]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<2.0", "ruff>=0.8,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/concept_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-p", "no:langsmith_plugin"]

[tool.ruff]
line-length = 100
target-version = "py311"
